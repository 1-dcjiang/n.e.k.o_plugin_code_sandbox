[plugin]
id = "code_sandbox"
name = "代码沙箱"
description = "让 YUI 在受限安全沙箱中执行 Python 代码：适合数学计算、数据处理、算法验证、逻辑推理辅助。系统命令、网络访问、文件写操作等危险行为一律被安全拦截；支持超时强制终止，防止资源耗尽。"
short_description = "YUI 安全执行 Python 代码：计算/数据处理/算法验证，危险操作自动拦截"
keywords = ["代码", "沙箱", "python", "计算", "算法", "数据处理", "code", "sandbox", "run", "执行", "安全"]
version = "0.1.0"
type = "plugin"
entry = "plugin.plugins.code_sandbox:CodeSandboxPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "使用说明"
entry = "docs/guide.md"
